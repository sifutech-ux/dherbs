name: Terbitkan ke Hostinger

on:
  push:
    branches:
      - kod

permissions:
  contents: write

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sediakan Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bina laman
        run: |
          npm ci
          npm run build

      - name: Hantar hasil ke branch main
        run: |
          git fetch origin main
          parent=$(git rev-parse origin/main)
          git -C dist init
          git -C dist add -A
          git -C dist -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Terbit laman"
          tree=$(git -C dist rev-parse 'HEAD^{tree}')
          new=$(git commit-tree "$tree" -p "$parent" -m "Terbit laman")
          git push origin "$new:main"
